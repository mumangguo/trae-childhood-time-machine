<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>梦想墙 · 童年时光机</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="https://lf-cdn.trae.com.cn/obj/trae-com-cn/trae_website_prod_cn/favicon.png">
</head>
<body>

<nav class="nav-bar">
  <a href="/" class="brand">TRA<span class="dot">E</span> · 时光机</a>
  <div class="nav-links">
    <a href="/"><i class="fa-solid fa-house"></i> 首页</a>
    <a href="/create.html"><i class="fa-solid fa-feather-pointed"></i> 写梦想</a>
    <a href="/wall.html"><i class="fa-solid fa-images"></i> 梦想墙</a>
  </div>
</nav>

<section class="container-pixel" style="padding-top:60px; padding-bottom:60px;">
  <div style="text-align:center; margin-bottom:36px;">
    <span class="pixel-chip">DREAM DANMAKU</span>
    <h2 class="pixel-title" style="font-size:clamp(22px,4vw,34px); margin-top:14px;">
      <i class="fa-solid fa-satellite-dish"></i> 梦想弹幕墙
    </h2>
    <p class="pixel-sub" style="margin-top:14px;">
      > 所有人写下的童年梦想，像信一样缓缓飘过时光机。
    </p>
    <div style="margin-top:18px;">
      <a href="/create.html" class="btn-pixel solid">
        <i class="fa-solid fa-pen-nib"></i> 我也要写一个
      </a>
    </div>
  </div>

  <div id="wallStage" class="danmaku-wall">
    <div id="wallLoading" class="loading">> 正在加载梦想弹幕...</div>
    <div id="wallEmpty" class="empty" style="display:none;">
      > 还没有梦想，<a style="color:var(--trae-green);" href="/create.html">第一个写下来</a>
    </div>
  </div>

  <div style="text-align:center; margin-top:22px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap;">
    <button id="refreshWall" class="btn-pixel"><i class="fa-solid fa-rotate"></i> 刷新弹幕</button>
    <a href="/create.html" class="btn-pixel ghost"><i class="fa-solid fa-envelope"></i> 发送我的梦想</a>
  </div>
</section>

<footer class="foot">
  <span class="brand-mini">TRAE</span>
  童年时光机 · 我的梦想档案馆 · 六一快乐
</footer>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
$(function () {
  TM.decorate(document.body);

  let pool = [];
  let timer = null;
  let lastId = null;

  function rand(min, max) { return min + Math.random() * (max - min); }
  function pickDream() {
    if (!pool.length) return null;
    if (pool.length === 1) return pool[0];
    let d = pool[Math.floor(Math.random() * pool.length)];
    let guard = 0;
    while (d.id === lastId && guard++ < 8) {
      d = pool[Math.floor(Math.random() * pool.length)];
    }
    lastId = d.id;
    return d;
  }

  function renderItem(d) {
    const top = rand(4, 82);
    const dur = rand(22, 42);
    const scale = rand(.86, 1.08);
    const traeHtml = d.trae
      ? '<div class="trae-text">现在我用 TRAE：' + TM.esc(d.trae) + '</div>'
      : '';
    return ''
      + '<a class="pixel-card dream-card danmaku-item" href="/card.html?id=' + d.id + '" '
      + 'style="top:' + top.toFixed(2) + '%; --dur:' + dur.toFixed(2) + 's; --scale:' + scale.toFixed(2) + '; text-decoration:none;">'
      + '  <span class="corner-tl"></span><span class="corner-br"></span>'
      + '  <div class="nick">'
      + '    <span><i class="fa-solid fa-user-astronaut"></i> ' + TM.esc(d.nickname) + '</span>'
      + '    <span class="time">' + TM.fmtTime(d.create_time) + '</span>'
      + '  </div>'
      + '  <div class="dream-text">✉ ' + TM.esc(d.dream) + '</div>'
      +    traeHtml
      + '  <div class="id-tag">DREAM #' + String(d.id).padStart(3, '0') + ' · 悬停暂停 · 点击查看</div>'
      + '</a>';
  }

  function spawnOne() {
    const d = pickDream();
    if (!d) return;
    const $item = $(renderItem(d));
    $('#wallStage').append($item);
    const dur = parseFloat($item[0].style.getPropertyValue('--dur')) || 30;
    setTimeout(() => $item.remove(), (dur + 1) * 1000);
  }

  function startDanmaku() {
    if (timer) clearInterval(timer);
    $('#wallStage .danmaku-item').remove();
    // 首屏散点：按时间倒序加载的池子中随机抽取，错峰出现。
    const firstCount = Math.min(pool.length, 12);
    for (let i = 0; i < firstCount; i++) setTimeout(spawnOne, i * 520);
    timer = setInterval(spawnOne, 1500);
  }

  async function loadWall() {
    if (timer) clearInterval(timer);
    $('#wallStage .danmaku-item').remove();
    $('#wallEmpty').hide();
    $('#wallLoading').show();
    const res = await TM.api('/api/dreams?page=1&size=50');
    $('#wallLoading').hide();
    if (!res || !res.ok) { TM.toast('加载失败', 'err'); return; }
    if (!res.data || !res.data.length) { $('#wallEmpty').show(); return; }
    pool = res.data; // 接口按时间倒序返回，随机从最新池子抽取
    startDanmaku();
  }

  $('#refreshWall').on('click', loadWall);
  loadWall();
});
</script>
</body>
</html>
