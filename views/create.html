<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>写下我的梦想 · 童年时光机</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="https://lf-cdn.trae.com.cn/obj/trae-com-cn/trae_website_prod_cn/favicon.png">
</head>
<body>

<nav class="nav-bar">
  <a href="/" class="brand">TRA<span class="dot">E</span> · 时光机</a>
  <div class="nav-links">
    <a href="/"><i class="fa-solid fa-house"></i> 首页</a>
    <a href="/create.html"><i class="fa-solid fa-feather-pointed"></i> 写梦想</a>
    <a href="/wall.html"><i class="fa-solid fa-images"></i> 梦想墙</a>
  </div>
</nav>

<section class="container-pixel" style="max-width:720px; padding-top:60px; padding-bottom:80px;">
  <h2 class="pixel-title" style="font-size:clamp(22px,4vw,34px); text-align:center;">
    <i class="fa-solid fa-pen-nib"></i> 写下我的梦想
  </h2>
  <p class="pixel-sub" style="text-align:center; margin-top:18px;">
    > 小时候我想 ______，现在我用 TRAE ______。
  </p>

  <p id="ipTip" class="pixel-sub" style="text-align:center; margin-top:6px; font-size:11px; color:var(--text-fade); min-height:18px;"></p>

  <form id="dreamForm" class="pixel-card" style="margin-top:34px;" autocomplete="off" novalidate>
    <span class="corner-tl"></span><span class="corner-br"></span>

    <div class="pixel-field">
      <label class="pixel-label" for="nickname">
        <i class="fa-solid fa-user-astronaut"></i> 昵称
        <span class="hint">(必填 · 最多 10 字)</span>
      </label>
      <input id="nickname" name="nickname" type="text" class="pixel-input" maxlength="10" placeholder="例如：小宇航员阿木" />
      <span class="pixel-counter" id="nicknameCounter">0 / 10</span>
    </div>

    <div class="pixel-field">
      <label class="pixel-label" for="dream">
        <i class="fa-solid fa-star"></i> 我的童年梦想
        <span class="hint">(必填 · 5 ~ 100 字)</span>
      </label>
      <textarea id="dream" name="dream" class="pixel-textarea" rows="4" maxlength="100" placeholder="例如：我想成为一名能开飞船去月球的科学家，把所有星星都画下来送给妈妈。"></textarea>
      <span class="pixel-counter" id="dreamCounter">0 / 100 （至少5字）</span>
    </div>

    <div class="pixel-field">
      <label class="pixel-label" for="trae">
        <i class="fa-solid fa-robot"></i> 现在我用 TRAE 可以 ______
        <span class="hint">(选填 · 最多 50 字)</span>
      </label>
      <input id="trae" name="trae" type="text" class="pixel-input" maxlength="50" placeholder="例如：用 TRAE 写一个属于自己的星空时光机。" />
      <span class="pixel-counter" id="traeCounter">0 / 50</span>
    </div>

    <div style="display:flex; gap:14px; flex-wrap:wrap; justify-content:flex-end; margin-top:8px;">
      <a href="/" class="btn-pixel ghost"><i class="fa-solid fa-rotate-left"></i> 返回</a>
      <button type="submit" id="submitBtn" class="btn-pixel solid">
        <i class="fa-solid fa-paper-plane"></i> 存入时光机
      </button>
    </div>
  </form>
</section>

<footer class="foot">
  <span class="brand-mini">TRAE</span>
  童年时光机 · 我的梦想档案馆 · 六一快乐
</footer>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
$(function () {
  TM.decorate(document.body);
  TM.bindCounter('#nickname', '#nicknameCounter', 10);
  TM.bindCounter('#dream', '#dreamCounter', 100, 5);
  TM.bindCounter('#trae', '#traeCounter', 50);

  // 异步预热指纹 + 显示 IP 归属（走同域后端，避免第三方接口 CORS）
  TM.getFingerprint();
  TM.getClientInfo().then((d) => {
    if (!d) return;
    const loc = [d.country, d.province, d.city].filter(Boolean).join(' · ');
    const ip = d.ip || '';
    $('#ipTip').html('> 检测到你的网络标识 <span style="color:var(--trae-green);">' + (loc || ip || '已记录') + '</span>，限同 IP / 设备 24h 内 1 条');
  });

  let submitting = false;
  $('#dreamForm').on('submit', async function (e) {
    e.preventDefault();
    if (submitting) return;
    const nickname = $('#nickname').val().trim();
    const dream = $('#dream').val().trim();
    const trae = $('#trae').val().trim();

    if (!nickname) return TM.toast('请填写昵称', 'err');
    if (TM.lenOf(nickname) > 10) return TM.toast('昵称最多 10 字', 'err');
    if (!dream) return TM.toast('请写下你的童年梦想', 'err');
    if (TM.lenOf(dream) < 5) return TM.toast('梦想至少 5 字', 'err');
    if (TM.lenOf(dream) > 100) return TM.toast('梦想最多 100 字', 'err');
    if (trae && TM.lenOf(trae) > 50) return TM.toast('TRAE 实现句最多 50 字', 'err');

    submitting = true;
    const $btn = $('#submitBtn');
    const html = $btn.html();
    $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 存档中...');

    const fp = await TM.getFingerprint();
    const res = await TM.api('/api/dream', {
      method: 'POST',
      body: JSON.stringify({ nickname, dream, trae, fp })
    });

    if (res && res.ok && res.data && res.data.id) {
      TM.toast('梦想已存入时光机！');
      setTimeout(() => { location.href = '/card.html?id=' + res.data.id; }, 600);
    } else {
      const msg = (res && res.msg) || '提交失败，请稍后重试';
      TM.toast(msg, 'err');
      submitting = false;
      $btn.prop('disabled', false).html(html);
    }
  });
});
</script>
</body>
</html>
