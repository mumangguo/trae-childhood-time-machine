<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>用 TRAE SOLO 实现梦想 · 童年时光机</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="https://lf-cdn.trae.com.cn/obj/trae-com-cn/trae_website_prod_cn/favicon.png">
</head>
<body>

<nav class="nav-bar">
  <a href="/" class="brand">TRA<span class="dot">E</span> · SOLO</a>
  <div class="nav-links">
    <a href="/"><i class="fa-solid fa-house"></i> 首页</a>
    <a href="/wall.html"><i class="fa-solid fa-images"></i> 梦想墙</a>
    <a href="https://solo.trae.cn/" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> 打开 SOLO</a>
  </div>
</nav>

<section class="solo-page">
  <aside class="solo-side pixel-card">
    <span class="corner-tl"></span><span class="corner-br"></span>
    <span class="pixel-chip">DREAM → SOLO</span>
    <h1 class="pixel-title" style="font-size:22px; margin-top:16px;">让 TRAE SOLO 实现梦想</h1>
    <p class="pixel-sub" style="line-height:1.8; margin-top:16px;">
      > 浏览器安全策略不允许本页面直接操作 solo.trae.cn 的输入框。<br/>
      > 已为你生成并复制提示词，进入 SOLO 后粘贴并回车即可开始。
    </p>

    <label class="pixel-label" style="margin-top:22px;">已生成的提示词</label>
    <textarea id="soloPrompt" class="pixel-textarea" rows="12" readonly></textarea>

    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;">
      <button class="btn-pixel solid" id="copyPrompt"><i class="fa-solid fa-copy"></i> 复制提示词</button>
      <a class="btn-pixel" href="https://solo.trae.cn/" target="_blank" rel="noopener"><i class="fa-solid fa-rocket"></i> 新标签打开 SOLO</a>
    </div>

    <p id="soloStatus" class="pixel-sub" style="font-size:12px; margin-top:16px; color:var(--trae-green);">> 正在读取梦想...</p>
  </aside>

  <main class="solo-frame-wrap">
    <div class="solo-frame-toolbar">
      <span><i class="fa-solid fa-satellite-dish"></i> https://solo.trae.cn/</span>
      <button id="reloadFrame" class="btn-pixel" style="padding:8px 12px; font-size:12px;"><i class="fa-solid fa-rotate"></i> 刷新</button>
    </div>
    <iframe id="soloFrame" class="solo-frame" src="https://solo.trae.cn/" title="TRAE SOLO"></iframe>
    <div class="solo-frame-mask" id="frameMask" style="display:none;">
      <div class="pixel-card" style="max-width:560px; text-align:center;">
        <span class="corner-tl"></span><span class="corner-br"></span>
        <h2 class="pixel-title" style="font-size:20px;">SOLO 可能禁止嵌入</h2>
        <p class="pixel-sub" style="line-height:1.8; margin:18px 0;">
          如果右侧页面空白或无法登录，请点击新标签打开 TRAE SOLO，然后粘贴已复制的提示词。
        </p>
        <a class="btn-pixel solid" href="https://solo.trae.cn/" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> 打开 TRAE SOLO</a>
      </div>
    </div>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
$(async function () {
  TM.decorate(document.body);
  const id = new URLSearchParams(location.search).get('id');

  function buildSoloPrompt(d) {
    return [
      '请用 TRAE SOLO 帮我把这个童年梦想做成一个可运行的小作品。',
      '',
      '我的昵称：' + d.nickname,
      '我的童年梦想：' + d.dream,
      d.trae ? ('现在我想用 TRAE：' + d.trae) : '',
      '',
      '作品要求：',
      '1. 做成一个黑绿像素风的小网站，风格接近 TRAE 官网；',
      '2. 要有童年、梦想、时光机、星星或纸飞机等元素；',
      '3. 页面需要有明显标题、互动按钮和适合截图分享的成品效果；',
      '4. 请直接生成完整可运行的前端代码，并说明如何运行。'
    ].filter(Boolean).join('\n');
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const t = document.createElement('textarea');
      t.value = text; document.body.appendChild(t); t.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (er) {}
      document.body.removeChild(t); return ok;
    }
  }

  if (!id) {
    $('#soloStatus').text('> 缺少梦想 ID，请从梦想卡片页进入');
    return;
  }
  const res = await TM.api('/api/dream/' + encodeURIComponent(id));
  if (!res || !res.ok || !res.data) {
    $('#soloStatus').text('> 读取梦想失败，请回梦想墙重新进入');
    return;
  }
  const prompt = buildSoloPrompt(res.data);
  $('#soloPrompt').val(prompt);
  const copied = await copyText(prompt);
  $('#soloStatus').text(copied ? '> 提示词已复制。请在 SOLO 输入框粘贴并回车。' : '> 请手动复制提示词到 SOLO。');

  $('#copyPrompt').on('click', async function () {
    const ok = await copyText($('#soloPrompt').val());
    TM.toast(ok ? '提示词已复制' : '复制失败，请手动复制', ok ? undefined : 'err');
  });
  $('#reloadFrame').on('click', function () {
    document.getElementById('soloFrame').src = 'https://solo.trae.cn/';
  });

  // 无法可靠检测 X-Frame-Options/CSP，延迟展示提示，不遮挡 iframe。
  setTimeout(() => $('#frameMask').show(), 3500);
});
</script>
</body>
</html>
