<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>梦想卡片 · 童年时光机</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="https://lf-cdn.trae.com.cn/obj/trae-com-cn/trae_website_prod_cn/favicon.png">
</head>
<body>

<nav class="nav-bar">
  <a href="/" class="brand">TRA<span class="dot">E</span> · 时光机</a>
  <div class="nav-links">
    <a href="/"><i class="fa-solid fa-house"></i> 首页</a>
    <a href="/create.html"><i class="fa-solid fa-feather-pointed"></i> 写梦想</a>
    <a href="/wall.html"><i class="fa-solid fa-images"></i> 梦想墙</a>
  </div>
</nav>

<section class="container-pixel" style="padding-top:50px; padding-bottom:80px;">

  <div id="successTip" style="display:none; text-align:center; margin-bottom:32px;">
    <span class="pixel-chip" style="font-size:12px;">SUCCESS</span>
    <h2 class="pixel-title" style="font-size:clamp(20px,3.4vw,28px); margin-top:14px;">
      你的梦想已存入 <span style="color:#fff;">·</span> 童年时光机
    </h2>
    <p class="pixel-sub" style="margin-top:14px;">
      未来某一天打开，你会发现：很多小时候的愿望，已经被 TRAE 悄悄实现。
    </p>
  </div>

  <div id="loadingBox" class="loading">> 正在打开时光机...</div>

  <div id="cardStage" class="card-stage" style="display:none;">
    <div id="cardCanvas" class="card-canvas">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="stamp">TRAE · DREAM ARCHIVE</div>

      <div class="block">
        <div class="label">DREAMER</div>
        <div class="nick-line" id="cNick">—</div>
      </div>

      <div class="block">
        <div class="label">CHILDHOOD DREAM</div>
        <div class="body" id="cDream">—</div>
      </div>

      <div class="block" id="cTraeBlock" style="display:none;">
        <div class="label">NOW WITH TRAE</div>
        <div class="body" id="cTrae">—</div>
      </div>

      <div class="time-line">
        <span id="cTime">—</span>　·　DREAM #<span id="cId">000</span>
      </div>
    </div>

    <div class="card-actions">
      <button class="btn-pixel" id="btnSave"><i class="fa-solid fa-download"></i> 保存图片</button>
      <button class="btn-pixel" id="btnCopy"><i class="fa-solid fa-link"></i> 复制链接</button>
      <a class="btn-pixel ghost" href="/wall.html"><i class="fa-solid fa-images"></i> 去梦想墙</a>
      <a class="btn-pixel ghost" href="/"><i class="fa-solid fa-house"></i> 返回首页</a>
    </div>

    <p id="shareLink" class="pixel-sub" style="text-align:center; margin-top:24px; word-break:break-all; font-size:12px;"></p>
  </div>
</section>

<footer class="foot">
  <span class="brand-mini">TRAE</span>
  童年时光机 · 我的梦想档案馆 · 六一快乐
</footer>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="/js/common.js"></script>
<script>
$(async function () {
  TM.decorate(document.body);

  const id = new URLSearchParams(location.search).get('id');
  if (!id) { location.href = '/'; return; }

  // 来自发布页时显示成功提示
  if (document.referrer.includes('/create')) {
    $('#successTip').show();
  }

  const res = await TM.api('/api/dream/' + encodeURIComponent(id));
  if (!res || !res.ok || !res.data) {
    $('#loadingBox').html('> 这条梦想找不到了 :( <br/><br/><a class="btn-pixel" href="/wall.html">去梦想墙看看</a>');
    return;
  }
  const d = res.data;
  $('#cNick').text(d.nickname);
  $('#cDream').text(d.dream);
  if (d.trae) { $('#cTrae').text(d.trae); $('#cTraeBlock').show(); }
  $('#cTime').text(TM.fmtTime(d.create_time));
  $('#cId').text(String(d.id).padStart(3, '0'));

  const url = location.origin + '/card.html?id=' + d.id;
  $('#shareLink').html('> 分享链接：<a style="color:var(--trae-green);" href="' + url + '">' + url + '</a>');

  $('#loadingBox').hide();
  $('#cardStage').show();

  // 复制链接
  $('#btnCopy').on('click', async function () {
    try {
      await navigator.clipboard.writeText(url);
      TM.toast('链接已复制，去分享吧！');
    } catch (e) {
      // 回退：选中输入框
      const t = document.createElement('textarea');
      t.value = url; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); TM.toast('链接已复制'); }
      catch (er) { TM.toast('复制失败，请手动复制', 'err'); }
      document.body.removeChild(t);
    }
  });

  // 保存图片
  $('#btnSave').on('click', async function () {
    const $btn = $(this);
    const html = $btn.html();
    $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 生成中...');
    try {
      const canvas = await html2canvas(document.getElementById('cardCanvas'), {
        backgroundColor: '#000',
        scale: 2,
        useCORS: true
      });
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'TRAE-Dream-' + d.id + '.png';
      a.click();
      TM.toast('图片已保存');
    } catch (e) {
      console.error(e);
      TM.toast('生成图片失败', 'err');
    } finally {
      $btn.prop('disabled', false).html(html);
    }
  });
});
</script>
</body>
</html>
